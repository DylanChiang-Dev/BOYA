name: quality-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Fetch and validate pinned Pi
        run: |
          scripts/dev/fetch-pi.sh
          scripts/dev/smoke-pi-rpc.sh
      - name: Reject removed runtime residue
        run: |
          test -z "$(find apps packages scripts \( -name target -o -name dist -o -name node_modules \) -prune -o -type f \( -iname '*opencode*' -o -iname '*jupyter*' -o -iname '*notebook*' -o -iname '*provenance*' -o -iname '*science_mcp*' \) -print 2>/dev/null)"
          ! rg -n -i 'OpenCodeClient|opencode serve|fetch-opencode|fetch-uv|science_mcp|runtime/(harness|skills|kernel|mcp|opencode-profile)' apps packages scripts package.json pnpm-workspace.yaml --glob '!**/target/**' --glob '!**/dist/**' --glob '!**/node_modules/**'
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  macos-arm64:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: scripts/dev/fetch-pi.sh
      - name: Build unsigned macOS Apple Silicon packages
        run: pnpm --filter @boya/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          source_app="$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -print -quit)"
          source_dmg="$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$source_app"
          test -n "$source_dmg"
          ditto -c -k --sequesterRsrc --keepParent "$source_app" dist/release/BOYA-Desktop_0.3.0_aarch64.app.zip
          cp "$source_dmg" dist/release/BOYA-Desktop_0.3.0_aarch64.dmg
          shasum -a 256 dist/release/* > dist/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BOYA-Desktop_0.3.0_aarch64
          path: dist/release/
          if-no-files-found: error
