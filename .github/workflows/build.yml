name: quality-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ripgrep
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned runtime resources
        run: |
          bash scripts/dev/fetch-opencode.sh x86_64-unknown-linux-gnu
          bash scripts/dev/fetch-uv.sh x86_64-unknown-linux-gnu
          bash scripts/dev/fetch-skills.sh
          bash scripts/dev/check-boya-skills.sh
          bash scripts/dev/check-brand-isolation.sh
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  macos-alpha:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned runtime resources
        run: |
          bash scripts/dev/fetch-opencode.sh aarch64-apple-darwin
          bash scripts/dev/fetch-uv.sh aarch64-apple-darwin
          bash scripts/dev/fetch-skills.sh
          bash scripts/dev/check-boya-skills.sh
      - name: Build unsigned macOS alpha
        run: pnpm --filter @boya/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: boya-desktop-aarch64-apple-darwin
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
